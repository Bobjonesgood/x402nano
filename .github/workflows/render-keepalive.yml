name: Render Keepalive (Archived)

on:
  # x402nano is a completed proof of concept. Scheduled Render pings are
  # intentionally disabled to prevent failures and notification emails after
  # the service was retired. Restore a schedule only if the Render service is
  # deliberately brought back online.
  workflow_dispatch:

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm archived status
        run: echo "x402nano Render keepalive is disabled; this proof of concept is archived."
